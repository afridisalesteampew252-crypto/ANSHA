name: Build ANSHA Customer APK

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Customer app HTTPS URL
        required: true
        default: https://www.anshatradingco.com/mobile
        type: string

concurrency:
  group: apk-customer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: '6'
      ANDROID_VERSION_NAME: '1.5'
      CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - name: Generate Android project
        run: npm run cap:add:android
      - name: Prepare Firebase, version, and Capacitor
        run: npm run cap:sync:android
      - name: Apply launcher icons, animated opening, and safe screen areas
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare-android-ui.py
      - name: Build installable test APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Record artifact checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ansha-customer-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/output-metadata.json
            android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
