name: Database Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/database/**'
      - '.github/workflows/security-database.yml'

permissions:
  contents: read

concurrency:
  group: database-regression-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Give the historical seed a unique disposable replay version
        # Two historical migrations share 20260920210000. Alias only this CI
        # checkout for disposable replay; preserve tracked SQL and hosted history.
        run: mv supabase/migrations/20260920210000_seed_export_master_options.sql supabase/migrations/20260920210001_seed_export_master_options.sql
      - name: Start disposable Supabase services and apply all migrations
        run: supabase start
      - name: Rebuild the disposable database from migration history
        run: supabase db reset --local
      - name: Run Phase 1 database regression tests
        run: supabase test db
      - name: Run transactional role and financial behavior suites
        run: |
          local_db_url="$(supabase status -o json | jq -r '.DB_URL')"
          test -n "$local_db_url"
          for test_file in tests/database/*.test.sql; do
            psql "$local_db_url" -X -v ON_ERROR_STOP=1 -f "$test_file"
          done
